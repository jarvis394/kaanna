name: Build

# Tags like v0.2.0 build every platform and attach the installers to a draft GitHub release.
# Run it by hand (Actions → Build → Run workflow) to get the installers as workflow artifacts only.
# Pushes to main that change dependencies or this workflow rebuild too, to refresh the Rust cache.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: Linux (x64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows (x64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            features: vulkan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # create the draft release on tag builds
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf libasound2-dev cmake clang libclang-dev

      # screencapturekit's Metal bridge needs the macOS 26 SDK; the macos-15 images default to
      # Xcode 16 but ship Xcode 26 alongside it.
      - name: Select Xcode 26
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # whisper.cpp's Vulkan backend (Windows GPU acceleration) needs the SDK's headers, import
      # library and shader compiler at build time. Users only need their GPU driver.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.309.0
        run: |
          curl.exe --fail -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\Bin"

      # ggml-vulkan builds its shader compiler as a nested CMake project, buried deep in Cargo's
      # target directory. Under the default one its paths pass Windows' 260-character limit, and
      # MSVC can't write debug info there, so CMake decides cl.exe doesn't work. A short target
      # directory keeps them in bounds.
      - name: Short Cargo target directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=$((Get-Item $env:GITHUB_WORKSPACE).Root)t"

      # Ninja in an MSVC developer shell, so the nested project finds the same compiler on PATH
      # as the outer one.
      - name: MSVC developer shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Use Ninja for CMake
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version
          Add-Content $env:GITHUB_ENV "CMAKE_GENERATOR=Ninja"

      # By default ggml tunes itself for the build machine's CPU, which can use instructions (e.g.
      # AVX-512) that users' CPUs lack. Target AVX2 instead: every x86 CPU since ~2013-2015.
      - name: Portable x86 CPU flags
        if: startsWith(matrix.target, 'x86_64')
        shell: bash
        run: |
          echo "GGML_NATIVE=OFF" >> "$GITHUB_ENV"
          for f in AVX AVX2 FMA F16C; do echo "GGML_$f=ON" >> "$GITHUB_ENV"; done

      - uses: oven-sh/setup-bun@v2

      # Matches the local toolchain; candle 0.10.2 is pinned for it (see README → Notes).
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
          # whisper-rs-sys formats its generated bindings with rustfmt.
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # On Windows the target directory is D:\t (see above), relative to D:\a\kaanna\kaanna\src-tauri.
          workspaces: src-tauri -> ${{ runner.os == 'Windows' && '../../../../t' || 'target' }}
          # whisper.cpp's build script doesn't watch the GGML_* variables; bump to rebuild it.
          key: ${{ matrix.target }}-ggml2
          # GitHub scopes caches to a ref: a tag or branch build can restore only its own caches
          # and main's. So only main saves (~700 MB per platform); every other build restores
          # main's latest, falling back to an older one when Cargo.lock has moved on, instead of
          # compiling every dependency from scratch.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: bun install --frozen-lockfile

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }}${{ matrix.features && format(' --features {0}', matrix.features) || '' }}
          # Only tag pushes publish; manual runs just build.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Käännä ${{ github.ref_name }}
          releaseBody: Unsigned builds. See the README for first-launch steps on each platform. The Windows *_portable.zip runs without installing.
          releaseDraft: true
          prerelease: false

      # The app's exe is self-contained (the UI is embedded; WebView2 ships with Windows 10/11),
      # so a zip of it runs without installing. Settings and models still live in the user's
      # profile under dev.kaanna.app, shared with an installed copy.
      - name: Portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $release = "$env:CARGO_TARGET_DIR\${{ matrix.target }}\release"
          $stage = "$env:RUNNER_TEMP\portable"
          New-Item -ItemType Directory -Force $stage, "$release\bundle\portable" | Out-Null
          Copy-Item "$release\kaanna.exe" "$stage\Kaanna.exe"
          $zip = "$release\bundle\portable\Kaanna_${version}_x64_portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          # Tag builds: attach it to the draft release tauri-action just created.
          if ("${{ github.ref_type }}" -eq "tag") { gh release upload "${{ github.ref_name }}" $zip --clobber }

      - uses: actions/upload-artifact@v4
        with:
          name: kaanna-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ env.CARGO_TARGET_DIR || 'src-tauri/target' }}/${{ matrix.target }}/release/bundle/dmg/*.dmg
            ${{ env.CARGO_TARGET_DIR || 'src-tauri/target' }}/${{ matrix.target }}/release/bundle/deb/*.deb
            ${{ env.CARGO_TARGET_DIR || 'src-tauri/target' }}/${{ matrix.target }}/release/bundle/rpm/*.rpm
            ${{ env.CARGO_TARGET_DIR || 'src-tauri/target' }}/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            ${{ env.CARGO_TARGET_DIR || 'src-tauri/target' }}/${{ matrix.target }}/release/bundle/msi/*.msi
            ${{ env.CARGO_TARGET_DIR || 'src-tauri/target' }}/${{ matrix.target }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR || 'src-tauri/target' }}/${{ matrix.target }}/release/bundle/portable/*.zip
