[package]
name = "kaanna"
version = "0.1.0"
description = "Local, on-device live Finnish → English translator"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kaanna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Whisper on the GPU through Vulkan; release builds for Windows enable it. Large v3 on the CPU
# takes over a minute per sentence. Needs the Vulkan SDK (`VULKAN_SDK`) to build, and the binary
# then links vulkan-1.dll, which every current GPU driver installs. Without a usable GPU at
# runtime, whisper.cpp falls back to the CPU.
vulkan = ["whisper-rs/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
cpal = "0.18"
whisper-rs = { version = "0.16", features = ["log_backend", "raw-api"] }
candle-core = "=0.10.2"
candle-nn = "=0.10.2"
candle-transformers = "=0.10.2"
unicode-normalization = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Apple-only acceleration; features unify with the plain dependencies above. Elsewhere whisper.cpp
# and candle run on the CPU.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
candle-core = { version = "=0.10.2", features = ["accelerate"] }
candle-nn = { version = "=0.10.2", features = ["accelerate"] }
candle-transformers = { version = "=0.10.2", features = ["accelerate"] }
screencapturekit = "11"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAnimation", "NSAnimationContext", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
# Strips the hairline DWM draws around frameless windows (see `borderless_frame`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Inference crates are painfully slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
